name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.4.0)'
        required: true

permissions:
  contents: read
  id-token: write   # OIDC for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Sanity tests (install-smoke + matrix + 71-ACs)
        run: |
          node tests/install-smoke.mjs
          node tests/install-matrix.mjs
          node tests/run-all-71-acs.mjs

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
