name: Sprint branch rebase check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  rebase-check:
    name: Warn if sprint branch is behind main
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'sprint/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count commits behind main
        id: count
        run: |
          BEHIND=$(git rev-list --count origin/main ^HEAD 2>/dev/null || echo 0)
          AHEAD=$(git rev-list --count HEAD ^origin/main 2>/dev/null || echo 0)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "Branch is $BEHIND behind, $AHEAD ahead of main"

      - name: Comment if stale (>20 commits behind)
        if: steps.count.outputs.behind > 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEHIND="${{ steps.count.outputs.behind }}"
          AHEAD="${{ steps.count.outputs.ahead }}"
          BODY=$(cat <<EOF
          ## ⚠ Sprint branch freshness check

          This sprint branch is **$BEHIND commits behind main** (and $AHEAD ahead).

          **Recommended:** rebase before continuing to avoid drift between sprint
          context and current main:

          \`\`\`bash
          git fetch origin main
          git rebase origin/main
          # Resolve conflicts; the sprint drift baseline may need rebaseline:
          bash scripts/sprint-amend-spec.sh
          \`\`\`

          The drift baseline (\`docs/sprints/$(echo "${{ github.head_ref }}" | sed 's|sprint/||')/.baseline-embedding.json\`)
          may be stale if main has shifted significantly.

          Auto-generated by \`.github/workflows/sprint-rebase-check.yml\` (P5d, gap #26).
          EOF
          )
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
